name: WebKit setup comparison
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  mobile:
    name: WebKit setup (${{ matrix.preparation }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preparation: [baseline, prepared]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ae799f15579ddc796399ee3e5b4b403d448145ac
          persist-credentials: false
      - name: Record source and preparation
        env:
          PREPARATION: ${{ matrix.preparation }}
        run: |
          mkdir -p .build/webkit-comparison
          git rev-parse HEAD | tee .build/webkit-comparison/source-sha.txt
          printf '%s\n' "$PREPARATION" > .build/webkit-comparison/preparation.txt
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Prepare Ubuntu mirrors and network waits
        if: matrix.preparation == 'prepared'
        run: bash .github/scripts/prepare-ubuntu-apt.sh
      - name: Install WebKit for the drawer check
        timeout-minutes: 10
        run: pnpm exec playwright-core install --with-deps webkit
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Resolve Chrome for the render check
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --version
          echo "ORCA_MOBILE_WEB_RENDER_BROWSER=$chrome" >> "$GITHUB_ENV"
      - name: Build and verify the app bundle
        run: pnpm run build:mobile-web
      - name: Builder, override census and render checks
        env:
          ORCA_MOBILE_WEB_APP_DEPS_REQUIRED: '1'
        run: node config/scripts/run-mobile-web-app-checks.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webkit-comparison-${{ matrix.preparation }}
          path: .build/webkit-comparison/
          retention-days: 30
